plugins {
    id 'java' // java 플러그인이 적용되면 실행 가능한 jar 파일을 빌드하기 위한 작업(task)이 자동으로 구성
    id 'org.springframework.boot' version '3.5.11' // 특정 다른 플러그인이 적용되는 것을 감지하고 그에 따라 반응
    id 'io.spring.dependency-management' version '1.1.7'
}

// 모든 프로젝트(Root 포함)에 적용되는 공통 설정
allprojects {
    group = 'com.lkt'
    version = '0.0.1'
    repositories {
        mavenCentral() // 라이브러리 다운로드 저장소
    }
}

// 자식 모듈들에만 적용되는 설정
subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    //implementation: 코드 작성, 런타임 시 모두 필요
    //compileOnly: 코드 작성, 빌드 시 필요
    //runtimeOnly: 런타임 시 필요
    //annotationProcessor: 빌드 과정에서 애노테이션을 읽어 코드 자동 생성 (Ex: 롬복)
    //testImplementation: 테스트 코드 작성, 런타임 모두 필요
    //testCompileOnly: 테스트 코드 빌드 시만 필요
    //testRuntimeOnly: 테스트 런타임 시 필요
    dependencies {
        //공통 의존성 설정
        testRuntimeOnly 'com.h2database:h2'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    ext {
        // Spring Cloud 버전을 변수로 지정 (편의성, 통일성)
        set('springCloudVersion', "2025.0.1")
    }

    // Gradle 테스트 코드 실행 시 어떤 엔진(도구)을 사용할지 지시
    tasks.named('test') {
        useJUnitPlatform() // JUnit 5 사용
    }
}

// 부모 프로젝트는 빌드 결과물(Jar) 만들지 않는다
// bootJar: 모든 라이브러리를 포함해 혼자 실행 가능
bootJar { enabled = false } //이 프로젝트를 실행 가능한 뚱뚱한(Fat) Jar로 만들지 마라
jar { enabled = true } //이 프로젝트를 다른 프로젝트가 갖다 쓸 수 있는 일반(Plain) Jar로 만들어라
