services:
# 1. Discovery-Service
  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    networks:
      - kt-service-net

# 2. Gateway-Service
  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "8000:8000"
    depends_on:
      - discovery-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    networks:
      - kt-service-net

# 3. Zookeeper (Kafka 실행을 위한 필수 코디네이터)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0 # M1/M2 완벽 지원
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - kt-service-net

# 4. Kafka (Confluent 공식 브로커)
  kafka-service:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-service
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # 내부 도커망에서는 29092, 호스트(맥북)에서는 9092 사용
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-service:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - kt-service-net 

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "9093:8080"
    depends_on:
      - kafka-service
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-confluent-kafka
      # 내부 네트워크망 주소와 포트(29092)를 사용
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-service:29092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
      - DYNAMIC_CONFIG_ENABLED=true
    networks:
      - kt-service-net

networks:
  kt-service-net:
    name: kt-service-net
    driver: bridge # 기본값
