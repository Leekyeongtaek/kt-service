spring:
  datasource:
    driver-class-name: org.h2.Driver
    # MODE=MySQL 옵션을 주면 H2가 MySQL의 SQL 문법을 이해하고 흉내 냅니다.
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop # 테스트가 켜질 때 Entity를 보고 테이블을 만들고, 꺼질 때 삭제함
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    generate-ddl: true